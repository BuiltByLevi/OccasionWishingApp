<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Special Wish for {{ name }} ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            overflow: hidden; 
        }
        
        #main-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            width: 90%;
            max-width: 650px;
            animation: slideUp 0.8s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            padding: 2.5rem;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        
        .floating-emoji {
            animation: float 3s ease-in-out infinite;
            font-size: 4rem;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        
        .selector-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 30;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }
        
        .whatsapp-share {
            position: fixed;
            bottom: 25px;
            left: 25px;
            z-index: 30;
            background: #25D366;
            padding: 12px 25px;
            border-radius: 50px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-family: 'Poppins', sans-serif;
        }
        
        .customize-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 30;
            padding: 10px 20px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-family: 'Poppins', sans-serif;
        }
        
        .chatbot {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 30;
            width: 320px;
            background: rgba(0,0,0,0.9);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        
        .chatbot-header {
            padding: 12px 15px;
            border-radius: 20px 20px 0 0;
            color: white;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        
        .chatbot-messages {
            height: 250px;
            overflow-y: auto;
            padding: 10px;
            color: white;
        }
        
        .chatbot-input-area {
            display: flex;
            padding: 10px;
            gap: 8px;
        }
        
        .chatbot-input {
            flex: 1;
            padding: 8px;
            border-radius: 20px;
            border: none;
            outline: none;
        }
        
        .chatbot-send-btn {
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 15px;
            cursor: pointer;
        }
        
        /* Custom Form Styles */
        .custom-form-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
        }
        
        .custom-form-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .custom-form-container input, 
        .custom-form-container textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }
        
        .custom-form-container textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .custom-form-container label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            color: #333;
        }
        
        .apply-btn {
            background: #25D366;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 10px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        
        .close-form-btn {
            background: #ff4757;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
        }
        
        h3 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        
        .message-text {
            white-space: pre-line;
        }
    </style>
</head>
<body>

<!-- Customize Button -->
<button class="customize-btn" id="customizeBtn" style="background: {{ theme_color|default:'#ff4d6d' }};">
    ✏️ Customize Message
</button>

<!-- Occasion Selector -->
<select class="selector-bar" id="occasionSelect">
    <option value="birthday" {% if occasion == 'birthday' %}selected{% endif %}>🎂 Birthday</option>
    <option value="anniversary" {% if occasion == 'anniversary' %}selected{% endif %}>💕 Anniversary</option>
    <option value="valentine" {% if occasion == 'valentine' %}selected{% endif %}>🌹 Valentine</option>
</select>

<!-- WhatsApp Share -->
<a href="#" id="shareBtn" class="whatsapp-share">
    📱 Share on WhatsApp
</a>

<!-- Main Card -->
<div id="main-card">
    <div class="glass-card">
        <div class="floating-emoji text-center">{{ emojis }}</div>
        <h1 class="text-5xl md:text-6xl font-bold text-center mt-4" style="color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">
            {{ title }} <span style="color: {{ theme_color|default:'#ff4d6d' }};">{{ name }}</span>!
        </h1>
        <p class="text-xl md:text-2xl text-center mt-6 message-text" style="color: rgba(255,255,255,0.95);">
            {{ message }}
        </p>
        <div class="text-center mt-8 text-3xl">
            ✨ 🎀 🎁 🎊 ✨
        </div>
    </div>
</div>

<!-- Custom Message Form -->
<div id="customFormOverlay" class="custom-form-overlay">
    <div class="custom-form-container">
        <h3>✨ Create Your Custom Wish ✨</h3>
        
        <label>Friend's Name:</label>
        <input type="text" id="customName" placeholder="Enter friend's name" value="{{ name }}">
        
        <label>Title:</label>
        <input type="text" id="customTitle" placeholder="e.g., Happy Birthday Dear" value="{{ title }}">
        
        <label>Custom Message:</label>
        <textarea id="customMessage" placeholder="Write your personalized message here...">{{ message }}</textarea>
        
        <label>Theme Color:</label>
        <input type="color" id="customColor" value="{{ theme_color|default:'#ff4d6d' }}">
        
        <label>Emojis:</label>
        <input type="text" id="customEmojis" placeholder="🎂🎈🎉" value="{{ emojis }}">
        
        <button class="apply-btn" id="applyCustom">🎉 Apply & Share Link</button>
        <button class="close-form-btn" id="closeFormBtn">Close</button>
    </div>
</div>

<!-- Chatbot -->
<div class="chatbot">
    <div class="chatbot-header" style="background: {{ theme_color|default:'#ff4d6d' }};">
        <span>🤖 WishBot</span>
        <span id="closeChat" style="cursor: pointer;">✕</span>
    </div>
    <div id="chatMessages" class="chatbot-messages"></div>
    <div class="chatbot-input-area">
        <input type="text" id="chatInput" class="chatbot-input" placeholder="Say something...">
        <button id="sendBtn" class="chatbot-send-btn" style="background: {{ theme_color|default:'#ff4d6d' }};">Send</button>
    </div>
</div>

<!-- 3D Background Script -->
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 25;
    
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    const occasion = '{{ occasion|default:"birthday" }}';
    let colorHex = 0xff4d6d;
    if (occasion === 'birthday') colorHex = 0xff4d6d;
    else if (occasion === 'anniversary') colorHex = 0xffb703;
    else if (occasion === 'valentine') colorHex = 0xff69b4;
    
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 2000;
    const posArray = new Float32Array(particlesCount * 3);
    
    for(let i = 0; i < particlesCount * 3; i += 3) {
        posArray[i] = (Math.random() - 0.5) * 100;
        posArray[i+1] = (Math.random() - 0.5) * 60;
        posArray[i+2] = (Math.random() - 0.5) * 50;
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMaterial = new THREE.PointsMaterial({ size: 0.15, color: colorHex, transparent: true, opacity: 0.6 });
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);
    
    const geometry = new THREE.SphereGeometry(1.5, 32, 32);
    const material = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 0.3 });
    const centerSphere = new THREE.Mesh(geometry, material);
    scene.add(centerSphere);
    
    const light = new THREE.PointLight(0xffffff, 1);
    light.position.set(10, 10, 10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404060));
    
    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += 0.01;
        particlesMesh.rotation.y = time * 0.05;
        particlesMesh.rotation.x = time * 0.03;
        centerSphere.rotation.x = time * 0.2;
        centerSphere.rotation.y = time * 0.3;
        renderer.render(scene, camera);
    }
    animate();
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

<script>
    // Chatbot Logic
    document.addEventListener('DOMContentLoaded', function() {
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const closeChat = document.getElementById('closeChat');
        const occasionSelect = document.getElementById('occasionSelect');
        const shareBtn = document.getElementById('shareBtn');
        const customizeBtn = document.getElementById('customizeBtn');
        const customFormOverlay = document.getElementById('customFormOverlay');
        const closeFormBtn = document.getElementById('closeFormBtn');
        const applyCustom = document.getElementById('applyCustom');

        function addMessage(sender, msg, isUser) {
            const div = document.createElement('div');
            div.style.marginBottom = '12px';
            div.style.textAlign = isUser ? 'right' : 'left';
            div.style.color = 'white';
            const themeColor = '{{ theme_color|default:"#ff4d6d" }}';
            div.innerHTML = '<strong style="color: ' + themeColor + ';">' + sender + ':</strong> <span style="background: ' + (isUser ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.5)') + '; padding: 5px 10px; border-radius: 15px; display: inline-block;">' + msg + '</span>';
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    
        function botReply(msg) {
            const lower = msg.toLowerCase();
            if(lower.includes('birthday')) return '🎂 Happy Birthday! Make a wish! 🕯️';
            if(lower.includes('anniversary')) return '💕 Congratulations! Wishing you endless love!';
            if(lower.includes('valentine')) return '🌹 Love is beautiful! Enjoy your day! 💖';
            if(lower.includes('thank')) return '😊 You\'re welcome! Spread the joy! 🎉';
            if(lower.includes('love')) return '💗 Love is everything! Have a fantastic day! ✨';
            return '🎈 That\'s awesome! Enjoy your special moment! 🌟';
        }
    
        function sendMessage() {
            const msg = chatInput.value.trim();
            if(!msg) return;
            addMessage('You', msg, true);
            chatInput.value = '';
            setTimeout(function() {
                const reply = botReply(msg);
                addMessage('WishBot', reply, false);
            }, 500);
        }
    
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        addMessage('WishBot', 'Hello! 👋 How can I make your day special?', false);

        if(closeChat) {
            closeChat.addEventListener('click', function() {
                document.querySelector('.chatbot').style.display = 'none';
            });
        }

        if(occasionSelect) {
            occasionSelect.addEventListener('change', function() {
                const url = new URL(window.location.href);
                url.searchParams.set('occasion', this.value);
                window.location.href = url;
            });
        }

        if(shareBtn) {
            shareBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const text = '✨ Special Wish For You! ✨\n\n{{ title }} {{ name }}!\n{{ message }}\n\nView here: ' + window.location.href;
                window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
            });
        }
        
        if(customizeBtn) {
            customizeBtn.addEventListener('click', function() {
                customFormOverlay.style.display = 'flex';
            });
        }
        
        if(closeFormBtn) {
            closeFormBtn.addEventListener('click', function() {
                customFormOverlay.style.display = 'none';
            });
        }
        
        if(applyCustom) {
            applyCustom.addEventListener('click', function() {
                const name = document.getElementById('customName').value;
                const title = document.getElementById('customTitle').value;
                const message = document.getElementById('customMessage').value;
                const color = document.getElementById('customColor').value.substring(1);
                const emojis = document.getElementById('customEmojis').value;
                
                let url = window.location.pathname + '?';
                if(name) url += 'to=' + encodeURIComponent(name) + '&';
                if(title) url += 'title=' + encodeURIComponent(title) + '&';
                if(message) url += 'message=' + encodeURIComponent(message) + '&';
                if(color) url += 'color=' + color + '&';
                if(emojis) url += 'emojis=' + encodeURIComponent(emojis) + '&';
                url += 'occasion=' + document.getElementById('occasionSelect').value;
                
                window.location.href = url;
            });
        }
        
        if(customFormOverlay) {
            customFormOverlay.addEventListener('click', function(e) {
                if (e.target === customFormOverlay) {
                    customFormOverlay.style.display = 'none';
                }
            });
        }
    });
</script>

</body>
</html>
