<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Special Wish for {{ name }} ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            overflow: hidden; 
        }
        
        #main-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            width: 90%;
            max-width: 650px;
            animation: slideUp 0.8s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            border-radius: 50px;
            padding: 2.5rem;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        
        .floating-emoji {
            animation: float 3s ease-in-out infinite;
            font-size: 4rem;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        
        .selector-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 30;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }
        
        .customize-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 30;
            padding: 10px 20px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-family: 'Poppins', sans-serif;
            background: {{ theme_color|default:'#ff4d6d' }};
        }
        
        /* Custom Form Styles */
        .custom-form-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
        }
        
        .custom-form-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 450px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .custom-form-container input, 
        .custom-form-container textarea,
        .custom-form-container select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }
        
        .custom-form-container textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .custom-form-container label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            color: #333;
        }
        
        .apply-btn {
            background: #25D366;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 10px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        
        .upload-btn-inline {
            background: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 10px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        
        .close-form-btn {
            background: #ff4757;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
        }
        
        h3 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        
        .message-text {
            white-space: pre-line;
        }
        
        .custom-image {
            max-width: 250px;
            max-height: 200px;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            object-fit: cover;
        }
        
        .image-preview {
            max-width: 100%;
            max-height: 150px;
            margin: 10px 0;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>

<!-- Customize Button -->
<button class="customize-btn" id="customizeBtn">
    ✏️ Customize Message
</button>

<!-- Occasion Selector -->
<select class="selector-bar" id="occasionSelect">
    <option value="birthday" {% if occasion == 'birthday' %}selected{% endif %}>🎂 Birthday</option>
    <option value="anniversary" {% if occasion == 'anniversary' %}selected{% endif %}>💕 Anniversary</option>
    <option value="valentine" {% if occasion == 'valentine' %}selected{% endif %}>🌹 Valentine</option>
</select>

<!-- Main Card -->
<div id="main-card">
    <div class="glass-card">
        <div class="floating-emoji text-center">{{ emojis }}</div>
        
        <!-- Title -->
        <h1 class="text-5xl md:text-6xl font-bold text-center mt-4" style="color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">
            {{ title }} <span style="color: {{ theme_color|default:'#ff4d6d' }};">{{ name }}</span>!
        </h1>
        
        <!-- Display Uploaded Image -->
        {% if custom_image %}
        <div class="text-center my-6">
            <img src="{{ custom_image }}" alt="Custom Image" class="custom-image">
        </div>
        {% endif %}
        
        <!-- Message -->
        <p class="text-xl md:text-2xl text-center mt-6 message-text" style="color: rgba(255,255,255,0.95);">
            {{ message }}
        </p>
        
        <div class="text-center mt-8 text-3xl">
            ✨ 🎀 🎁 🎊 ✨
        </div>
    </div>
</div>

<!-- Custom Message Form with Image Upload INSIDE -->
<div id="customFormOverlay" class="custom-form-overlay">
    <div class="custom-form-container">
        <h3>✨ Create Your Custom Wish ✨</h3>
        
        <form method="POST" action="/upload-image/" enctype="multipart/form-data" id="uploadForm">
            {% csrf_token %}
            <label>🎨 Upload Custom Image (Optional):</label>
            <input type="file" name="custom_image" accept="image/*" id="imageInput">
            <div class="image-preview" id="imagePreview"></div>
            <input type="hidden" name="occasion" id="uploadOccasion" value="{{ occasion }}">
        </form>
        
        <label>Friend's Name:</label>
        <input type="text" id="customName" placeholder="Enter friend's name" value="{{ name }}">
        
        <label>Title:</label>
        <input type="text" id="customTitle" placeholder="e.g., Happy Birthday Dear" value="{{ title }}">
        
        <label>Custom Message:</label>
        <textarea id="customMessage" placeholder="Write your personalized message here...">{{ message }}</textarea>
        
        <label>Theme Color:</label>
        <input type="color" id="customColor" value="{{ theme_color|default:'#ff4d6d' }}">
        
        <label>Emojis:</label>
        <input type="text" id="customEmojis" placeholder="🎂🎈🎉" value="{{ emojis }}">
        
        <button class="apply-btn" id="applyCustom">🎉 Apply & Share Link</button>
        <button class="close-form-btn" id="closeFormBtn">Close</button>
    </div>
</div>

<!-- 3D Background Script -->
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 25;
    
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    const occasion = '{{ occasion|default:"birthday" }}';
    let colorHex = 0xff4d6d;
    if (occasion === 'birthday') colorHex = 0xff4d6d;
    else if (occasion === 'anniversary') colorHex = 0xffb703;
    else if (occasion === 'valentine') colorHex = 0xff69b4;
    
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 2000;
    const posArray = new Float32Array(particlesCount * 3);
    
    for(let i = 0; i < particlesCount * 3; i += 3) {
        posArray[i] = (Math.random() - 0.5) * 100;
        posArray[i+1] = (Math.random() - 0.5) * 60;
        posArray[i+2] = (Math.random() - 0.5) * 50;
    }
    
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMaterial = new THREE.PointsMaterial({ size: 0.15, color: colorHex, transparent: true, opacity: 0.6 });
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);
    
    const geometry = new THREE.SphereGeometry(1.5, 32, 32);
    const material = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 0.3 });
    const centerSphere = new THREE.Mesh(geometry, material);
    scene.add(centerSphere);
    
    const light = new THREE.PointLight(0xffffff, 1);
    light.position.set(10, 10, 10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404060));
    
    let time = 0;
    function animate() {
        requestAnimationFrame(animate);
        time += 0.01;
        particlesMesh.rotation.y = time * 0.05;
        particlesMesh.rotation.x = time * 0.03;
        centerSphere.rotation.x = time * 0.2;
        centerSphere.rotation.y = time * 0.3;
        renderer.render(scene, camera);
    }
    animate();
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

<script>
    // Custom Message Form Logic
    document.addEventListener('DOMContentLoaded', function() {
        const customizeBtn = document.getElementById('customizeBtn');
        const customFormOverlay = document.getElementById('customFormOverlay');
        const closeFormBtn = document.getElementById('closeFormBtn');
        const applyCustom = document.getElementById('applyCustom');
        const occasionSelect = document.getElementById('occasionSelect');
        
        // Image upload elements
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const uploadOccasion = document.getElementById('uploadOccasion');
        const uploadForm = document.getElementById('uploadForm');

        // Customize button logic
        if(customizeBtn) {
            customizeBtn.addEventListener('click', function() {
                customFormOverlay.style.display = 'flex';
            });
        }
        
        if(closeFormBtn) {
            closeFormBtn.addEventListener('click', function() {
                customFormOverlay.style.display = 'none';
                // Reset preview when closing
                if(imagePreview) imagePreview.style.display = 'none';
            });
        }
        
        // Image preview logic
        if(imageInput) {
            imageInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        imagePreview.innerHTML = '<img src="' + event.target.result + '" style="max-width: 100%; max-height: 150px; border-radius: 10px;">';
                        imagePreview.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                    
                    // Update occasion and auto-upload
                    if(uploadOccasion) uploadOccasion.value = occasionSelect ? occasionSelect.value : 'birthday';
                    
                    // Auto-submit the form
                    const formData = new FormData(uploadForm);
                    fetch('/upload-image/', {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]')?.value || ''
                        }
                    }).then(() => {
                        // Reload page to show image
                        setTimeout(() => location.reload(), 500);
                    });
                }
            });
        }
        
        if(applyCustom) {
            applyCustom.addEventListener('click', function() {
                const name = document.getElementById('customName').value;
                const title = document.getElementById('customTitle').value;
                const message = document.getElementById('customMessage').value;
                const color = document.getElementById('customColor').value.substring(1);
                const emojis = document.getElementById('customEmojis').value;
                
                let url = window.location.pathname + '?';
                if(name) url += 'to=' + encodeURIComponent(name) + '&';
                if(title) url += 'title=' + encodeURIComponent(title) + '&';
                if(message) url += 'message=' + encodeURIComponent(message) + '&';
                if(color) url += 'color=' + color + '&';
                if(emojis) url += 'emojis=' + encodeURIComponent(emojis) + '&';
                if(occasionSelect) url += 'occasion=' + occasionSelect.value;
                
                window.location.href = url;
            });
        }
        
        if(customFormOverlay) {
            customFormOverlay.addEventListener('click', function(e) {
                if (e.target === customFormOverlay) {
                    customFormOverlay.style.display = 'none';
                }
            });
        }

        // Occasion selector logic
        if(occasionSelect) {
            occasionSelect.addEventListener('change', function() {
                const url = new URL(window.location.href);
                url.searchParams.set('occasion', this.value);
                window.location.href = url;
            });
        }
    });
</script>

</body>
</html>
